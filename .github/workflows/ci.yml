name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          PYTHONPATH=backend pytest -q backend/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend checks
        run: |
          cd frontend
          npm install
          npm run build
          npm run test
